name: "[Reusable] AI-guarded review (guard + Claude review + label management)"

on:
  workflow_call:
    inputs:
      team-slug:
        required: true
        type: string
        description: "Team slug to check against (e.g. prestashop-sa)"
      actor:
        required: true
        type: string
        description: "GitHub login to verify (github.event.sender.login)"
      pr-number:
        required: true
        type: number
        description: "PR number"
      repository:
        required: true
        type: string
        description: "owner/repo (e.g. PrestaShop/ps_apiresources)"
      prompt:
        required: true
        type: string
        description: "The review prompt to pass to Claude"
      trigger-label:
        required: false
        type: string
        default: "Need AI review"
        description: "Label that triggers the review (removed on completion or guard failure)"
      reviewed-label:
        required: false
        type: string
        default: "AI reviewed"
        description: "Label added after a successful review"
      claude-model:
        required: false
        type: string
        default: "claude-sonnet-4-6"
        description: "Claude model to use for the review"
      max-turns:
        required: false
        type: number
        default: 40
        description: "Maximum number of turns for Claude"
      allowed-tools:
        required: false
        type: string
        default: "Read,Glob,Grep,LS,WebFetch,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
        description: "Comma-separated list of tools Claude is allowed to use"
    secrets:
      org-read-token:
        required: true
        description: "PAT with read:org scope for team membership check"
      github-token:
        required: true
        description: "GITHUB_TOKEN from the calling repository"
      anthropic-api-key:
        required: true
        description: "Anthropic API key for Claude"

jobs:
  # Step 1: Check if PR was already reviewed
  check-label:
    name: Check reviewed label
    runs-on: ubuntu-24.04
    outputs:
      already-reviewed: ${{ steps.check.outputs.already-reviewed }}
    steps:
      - name: Check for reviewed label
        id: check
        env:
          GH_TOKEN: ${{ secrets.github-token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          REPO: ${{ inputs.repository }}
          LABEL: ${{ inputs.reviewed-label }}
        run: |
          HAS=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels \
            | jq -r --arg l "$LABEL" '[.labels[].name] | contains([$l])')
          echo "already-reviewed=$HAS" >> "$GITHUB_OUTPUT"
          if [ "$HAS" = "true" ]; then
            echo "⚠️ PR #$PR_NUMBER already has the '$LABEL' label — skipping Claude review." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Step 2: Check team membership only if label is absent
  check-membership:
    name: Check team membership
    runs-on: ubuntu-24.04
    needs: check-label
    if: needs.check-label.outputs.already-reviewed != 'true'
    outputs:
      is-member: ${{ steps.check.outputs.is_member }}
    steps:
      - name: Check team membership
        id: check
        uses: PrestaShop/.github/.github/actions/team-guard@master
        with:
          team_slug: ${{ inputs.team-slug }}
          actor: ${{ inputs.actor }}
          org: PrestaShop
          token: ${{ secrets.org-read-token }}
          # The gate job decides what to do with the result, so do not fail here
          require_membership: false

  # Step 3: Evaluate guard
  gate:
    name: Evaluate guard
    runs-on: ubuntu-24.04
    needs: [check-label, check-membership]
    if: always()
    outputs:
      can-run: ${{ steps.evaluate.outputs.can-run }}
    steps:
      - name: Evaluate guard conditions
        id: evaluate
        env:
          IS_MEMBER: ${{ needs.check-membership.outputs.is-member }}
          ALREADY_REVIEWED: ${{ needs.check-label.outputs.already-reviewed }}
        run: |
          if [ "$IS_MEMBER" = "true" ] && [ "$ALREADY_REVIEWED" != "true" ]; then
            echo "can-run=true" >> "$GITHUB_OUTPUT"
            echo "✅ All guards passed — Claude review can run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "can-run=false" >> "$GITHUB_OUTPUT"
            echo "🚫 Guard blocked: is-member=$IS_MEMBER, already-reviewed=$ALREADY_REVIEWED." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Step 4: Guard failed — remove trigger label and fail
  guard-failed:
    name: Guard failed
    needs: gate
    if: needs.gate.outputs.can-run != 'true'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.github-token }}
    steps:
      - name: Remove trigger label and fail
        run: |
          gh pr edit ${{ inputs.pr-number }} --repo "${{ inputs.repository }}" \
            --remove-label "${{ inputs.trigger-label }}"
          echo "::error::Guard check failed — the actor is not a member of the required team or the PR was already reviewed."
          echo "⛔ Guard check failed — Claude review will not run. Label '${{ inputs.trigger-label }}' removed." >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # Step 5: Run Claude review
  ai-review:
    name: Claude AI review
    needs: gate
    if: needs.gate.outputs.can-run == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.github-token }}
      PR_NUMBER: ${{ inputs.pr-number }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Snapshot the time just before Claude runs. The review comment is posted by
      # Claude itself (via `gh pr comment`), so "a comment exists that is newer than
      # this" is how the verification step below proves a review was actually posted.
      - name: Record review start time
        run: echo "REVIEW_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Run Claude review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.anthropic-api-key }}
          github_token: ${{ secrets.github-token }}
          claude_args: '--model ${{ inputs.claude-model }} --max-turns ${{ inputs.max-turns }} --allowedTools "${{ inputs.allowed-tools }}"'
          prompt: ${{ inputs.prompt }}

      # Runs even when the review step failed (if: always()) so it can produce
      # the execution report and double-check the output. The Claude step now
      # fails the job natively on an SDK/API error; this step still surfaces
      # problems the action itself does not flag (permission denials, is_error
      # results) and re-confirms the failure for clarity.
      - name: Validate Claude execution
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          STEP_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          # When the review step fails it often does not export the
          # execution_file output, even though the action still wrote the log to
          # the runner temp dir. Fall back to that known location so a failed run
          # can still be parsed and reported on (the hard-fail happens later,
          # after the report — not here).
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            EXECUTION_FILE="${RUNNER_TEMP}/claude-execution-output.json"
          fi
          # Only exit early when there is genuinely nothing on disk to analyze.
          if [ ! -f "$EXECUTION_FILE" ]; then
            if [ "$STEP_OUTCOME" = "failure" ]; then
              echo "::error::The Claude review action failed (outcome=failure) and produced no execution output file. This usually indicates an early SDK/API error such as an exhausted credit balance, invalid API key, or network failure."
            else
              echo "::error::Claude execution output file not found."
            fi
            exit 1
          fi
          # The execution file can be a JSON array (conversation log) or a single object.
          # When it's an array, the result object is the last element.
          FILE_TYPE=$(jq -r 'type' "$EXECUTION_FILE")
          if [ "$FILE_TYPE" = "array" ]; then
            RESULT=$(jq '.[-1]' "$EXECUTION_FILE")
          else
            RESULT=$(jq '.' "$EXECUTION_FILE")
          fi
          IS_ERROR=$(echo "$RESULT" | jq -r '.is_error // false')
          SUBTYPE=$(echo "$RESULT" | jq -r '.subtype // "unknown"')
          NUM_TURNS=$(echo "$RESULT" | jq -r '.num_turns // 0')
          DENIALS=$(echo "$RESULT" | jq -r '.permission_denials_count // 0')
          COST=$(echo "$RESULT" | jq -r '.total_cost_usd // 0')
          echo "## Claude execution report" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Action outcome | $STEP_OUTCOME |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | $SUBTYPE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Turns used | $NUM_TURNS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Permission denials | $DENIALS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cost | \$${COST} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Error | $IS_ERROR |" >> "$GITHUB_STEP_SUMMARY"
          FAILED=false
          # Re-confirm the action's own failure for clarity. The job already
          # fails natively when this step's outcome is "failure", but surfacing
          # it here keeps the report accurate. Note: such errors can report
          # subtype="success" while is_error=true, so STEP_OUTCOME and is_error
          # — not subtype — are the reliable signals.
          if [ "$STEP_OUTCOME" = "failure" ]; then
            echo "::error::The Claude review action failed (outcome=failure, subtype=$SUBTYPE, is_error=$IS_ERROR). This usually indicates an SDK/API error such as an exhausted credit balance, invalid API key, or network failure."
            FAILED=true
          fi
          if [ "$DENIALS" -gt 0 ] && [ "$DENIALS" -ge "$NUM_TURNS" ]; then
            echo "::error::Claude was denied permissions on almost every turn ($DENIALS/$NUM_TURNS). Check allowed_tools configuration."
            FAILED=true
          fi
          # Reaching max turns is the one tolerated error: a partial review may
          # have been posted, so warn but do not fail.
          if [ "$SUBTYPE" = "error_max_turns" ]; then
            echo "::warning::Claude reached the maximum number of turns ($NUM_TURNS). The review may be incomplete."
          elif [ "$IS_ERROR" = "true" ]; then
            echo "::error::Claude reported an error result (subtype=$SUBTYPE). No valid review was produced."
            FAILED=true
          fi
          if [ "$FAILED" = "true" ]; then
            exit 1
          fi

      # The review comment is posted by Claude itself via `gh pr comment`, within the
      # --max-turns budget. On a large PR Claude can exhaust that budget before it ever
      # comments, which surfaces as `error_max_turns` — tolerated above as a warning.
      # Without this check the job would still succeed and apply the reviewed label with
      # no review posted at all. Confirm a bot comment was actually created/updated during
      # this run; if not, fail so the failure-cleanup below restores the trigger label
      # instead of silently marking the PR reviewed.
      - name: Verify a review comment was posted
        env:
          REPO: ${{ inputs.repository }}
        run: |
          LATEST=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]")] | max_by(.updated_at) | .updated_at // ""')
          if [ -z "$LATEST" ] || [[ "$LATEST" < "$REVIEW_STARTED_AT" ]]; then
            echo "::error::No review comment was posted during this run (latest bot comment: '${LATEST:-none}', run started: $REVIEW_STARTED_AT). Claude likely reached --max-turns before commenting. Failing so the '${{ inputs.trigger-label }}' label is restored instead of marking the PR reviewed."
            echo "⛔ No review comment was posted — not marking the PR as reviewed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ Review comment confirmed (posted/updated at $LATEST)." >> "$GITHUB_STEP_SUMMARY"

      # If any step above failed (review errored, validation caught a problem,
      # or no comment was posted), remove the trigger label so a reviewer can
      # re-add it to relaunch the review later — mirroring the guard-failed cleanup.
      - name: Remove trigger label on failure
        if: failure()
        run: |
          gh pr edit "$PR_NUMBER" --repo "${{ inputs.repository }}" \
            --remove-label "${{ inputs.trigger-label }}"
          echo "::warning::Claude review did not complete — removed the '${{ inputs.trigger-label }}' label. Re-add it to relaunch the review."
          echo "⚠️ Claude review did not complete — label '${{ inputs.trigger-label }}' removed. Re-add it to retry." >> "$GITHUB_STEP_SUMMARY"

      - name: Update labels
        run: |
          gh pr edit "$PR_NUMBER" --repo "${{ inputs.repository }}" \
            --add-label "${{ inputs.reviewed-label }}" \
            --remove-label "${{ inputs.trigger-label }}"
          echo "✅ Label '${{ inputs.reviewed-label }}' added, '${{ inputs.trigger-label }}' removed." >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        run: |
          echo "## Review summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **PR:** #$PR_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Actor:** ${{ inputs.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Model:** ${{ inputs.claude-model }}" >> "$GITHUB_STEP_SUMMARY"
